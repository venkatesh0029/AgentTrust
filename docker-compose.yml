version: '3.8'

services:
  agenttrust-server:
    build: .
    container_name: agenttrust-gateway-server
    ports:
      - "8000:8000"
    environment:
      AGENTTRUST_ENV: ${AGENTTRUST_ENV:?Set AGENTTRUST_ENV to development or production}
      AGENTTRUST_MODE: ${AGENTTRUST_MODE:-MODE_D_AGENTTRUST_FABRIC}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?Set GATEWAY_SECRET in your environment or .env}
      AGENTTRUST_DEMO_MODE: ${AGENTTRUST_DEMO_MODE:-false}
      AGENTTRUST_ALLOW_MODE_CHANGE: ${AGENTTRUST_ALLOW_MODE_CHANGE:-false}
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      FABRIC_GATEWAY_MODE: ${FABRIC_GATEWAY_MODE:-simulator}
      FABRIC_GATEWAY_URL: ${FABRIC_GATEWAY_URL:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
