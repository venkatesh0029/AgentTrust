# Reference example only — AgentTrust does not load this file at runtime.
# Runtime configuration is supplied through process environment variables.
# Do not store credentials or production secrets in this file.
# See documentation/configuration.md.

system:
  name: "AgentTrust Security Framework"
  version: "1.0.0"

cryptography:
  key_size: 2048
  cert_valid_days: 365
  hash_algorithm: "SHA256"
  ca_common_name: "AgentTrust Root Security Authority"

replay_protection:
  timestamp_window_seconds: 120
  clean_interval_seconds: 300

blockchain:
  org_name: "AgentTrustOrg"
  channel_name: "agenttrust-channel"
  chaincode_name: "agenttrust-cc"
