name: agenttrust-raft3

volumes:
  orderer1-data:
  orderer2-data:
  orderer3-data:
  peer0-org1-data:
  peer0-org2-data:
  couchdb0-org1-data:
  couchdb0-org2-data:

networks:
  raft3-net:
    name: agenttrust-raft3-net

services:
  orderer1.agenttrust.com:
    image: hyperledger/fabric-orderer:2.5.4
    hostname: orderer1.agenttrust.com
    restart: unless-stopped
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_GENERAL_GENESISMETHOD: file
      ORDERER_GENERAL_GENESISFILE: /var/hyperledger/orderer/orderer.genesis.block
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
    volumes:
      - ./channel-artifacts/orderer.genesis.block:/var/hyperledger/orderer/orderer.genesis.block:ro
      - ./crypto-config/ordererOrganizations/agenttrust.com/orderers/orderer1.agenttrust.com/msp:/var/hyperledger/orderer/msp:ro
      - ./crypto-config/ordererOrganizations/agenttrust.com/orderers/orderer1.agenttrust.com/tls:/var/hyperledger/orderer/tls:ro
      - orderer1-data:/var/hyperledger/production/orderer
    ports:
      - "127.0.0.1:17050:7050"
    networks: [raft3-net]

  orderer2.agenttrust.com:
    image: hyperledger/fabric-orderer:2.5.4
    hostname: orderer2.agenttrust.com
    restart: unless-stopped
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_GENERAL_GENESISMETHOD: file
      ORDERER_GENERAL_GENESISFILE: /var/hyperledger/orderer/orderer.genesis.block
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
    volumes:
      - ./channel-artifacts/orderer.genesis.block:/var/hyperledger/orderer/orderer.genesis.block:ro
      - ./crypto-config/ordererOrganizations/agenttrust.com/orderers/orderer2.agenttrust.com/msp:/var/hyperledger/orderer/msp:ro
      - ./crypto-config/ordererOrganizations/agenttrust.com/orderers/orderer2.agenttrust.com/tls:/var/hyperledger/orderer/tls:ro
      - orderer2-data:/var/hyperledger/production/orderer
    ports:
      - "127.0.0.1:18050:7050"
    networks: [raft3-net]

  orderer3.agenttrust.com:
    image: hyperledger/fabric-orderer:2.5.4
    hostname: orderer3.agenttrust.com
    restart: unless-stopped
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_GENERAL_GENESISMETHOD: file
      ORDERER_GENERAL_GENESISFILE: /var/hyperledger/orderer/orderer.genesis.block
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
    volumes:
      - ./channel-artifacts/orderer.genesis.block:/var/hyperledger/orderer/orderer.genesis.block:ro
      - ./crypto-config/ordererOrganizations/agenttrust.com/orderers/orderer3.agenttrust.com/msp:/var/hyperledger/orderer/msp:ro
      - ./crypto-config/ordererOrganizations/agenttrust.com/orderers/orderer3.agenttrust.com/tls:/var/hyperledger/orderer/tls:ro
      - orderer3-data:/var/hyperledger/production/orderer
    ports:
      - "127.0.0.1:19050:7050"
    networks: [raft3-net]

  couchdb0.org1.agenttrust.com:
    image: couchdb:3.3.2
    restart: unless-stopped
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: adminpw
    ports:
      - "127.0.0.1:15984:5984"
    volumes:
      - couchdb0-org1-data:/opt/couchdb/data
    networks: [raft3-net]

  couchdb0.org2.agenttrust.com:
    image: couchdb:3.3.2
    restart: unless-stopped
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: adminpw
    ports:
      - "127.0.0.1:16984:5984"
    volumes:
      - couchdb0-org2-data:/opt/couchdb/data
    networks: [raft3-net]

  peer0.org1.agenttrust.com:
    image: hyperledger/fabric-peer:2.5.4
    hostname: peer0.org1.agenttrust.com
    restart: unless-stopped
    environment:
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: agenttrust-raft3-net
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_PROFILE_ENABLED: "true"
      CORE_PEER_ID: peer0.org1.agenttrust.com
      CORE_PEER_ADDRESS: peer0.org1.agenttrust.com:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.org1.agenttrust.com:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org1.agenttrust.com:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org1.agenttrust.com:7051
      CORE_PEER_LOCALMSPID: Org1MSP
      CORE_LEDGER_STATE_STATEDATABASE: CouchDB
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb0.org1.agenttrust.com:5984
      CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: admin
      CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: adminpw
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
    volumes:
      - ./crypto-config/peerOrganizations/org1.agenttrust.com/peers/peer0.org1.agenttrust.com/msp:/etc/hyperledger/fabric/msp:ro
      - ./crypto-config/peerOrganizations/org1.agenttrust.com/peers/peer0.org1.agenttrust.com/tls:/etc/hyperledger/fabric/tls:ro
      - peer0-org1-data:/var/hyperledger/production
      - /var/run/:/host/var/run/
    ports:
      - "127.0.0.1:17051:7051"
    depends_on:
      - couchdb0.org1.agenttrust.com
    networks: [raft3-net]

  peer0.org2.agenttrust.com:
    image: hyperledger/fabric-peer:2.5.4
    hostname: peer0.org2.agenttrust.com
    restart: unless-stopped
    environment:
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: agenttrust-raft3-net
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_PROFILE_ENABLED: "true"
      CORE_PEER_ID: peer0.org2.agenttrust.com
      CORE_PEER_ADDRESS: peer0.org2.agenttrust.com:9051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_CHAINCODEADDRESS: peer0.org2.agenttrust.com:9052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org2.agenttrust.com:9051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org2.agenttrust.com:9051
      CORE_PEER_LOCALMSPID: Org2MSP
      CORE_LEDGER_STATE_STATEDATABASE: CouchDB
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb0.org2.agenttrust.com:5984
      CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: admin
      CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: adminpw
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
    volumes:
      - ./crypto-config/peerOrganizations/org2.agenttrust.com/peers/peer0.org2.agenttrust.com/msp:/etc/hyperledger/fabric/msp:ro
      - ./crypto-config/peerOrganizations/org2.agenttrust.com/peers/peer0.org2.agenttrust.com/tls:/etc/hyperledger/fabric/tls:ro
      - peer0-org2-data:/var/hyperledger/production
      - /var/run/:/host/var/run/
    ports:
      - "127.0.0.1:19051:9051"
    depends_on:
      - couchdb0.org2.agenttrust.com
    networks: [raft3-net]
