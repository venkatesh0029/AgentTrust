name: AgentTrust CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Pytest & Hypothesis Security Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov hypothesis ruff mypy PyJWT httpx

      - name: Code Linting with Ruff
        run: |
          ruff check .

      - name: Type Checking with MyPy
        run: |
          mypy --ignore-missing-imports identity_manager action_gateway policy_engine fabric

      - name: Run Complete Test Suite
        run: |
          pytest -v --cov=. --cov-report=term-missing
