name: AgentTrust Enterprise Security CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Automated Security, Fuzzing & Formal Verification Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/to-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies & SoftHSM2
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2 libsofthsm2 openssl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Regression Suite & 20-Scenario Attack Lab
        run: |
          pytest tests attack_lab -v --tb=short

      - name: Run Comparative OPA & OAuth2 Benchmark Engine
        run: |
          python benchmarks/comparative_benchmark.py

      - name: Run Prompt Injection Dataset Precision & Recall Benchmark
        run: |
          python benchmarks/prompt_injection_dataset_benchmark.py
